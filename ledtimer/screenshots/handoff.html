<!doctype html><meta charset="utf-8"><title>handoff</title>
<script>
(async () => {
  const names = ['u1.jpg', 'u2.jpg', 'u3.jpg'];
  const files = [];
  for (const n of names) files.push({ name: n, blob: await (await fetch(n)).blob() });
  window.opener && window.opener.postMessage({ ledtimerFiles: files }, 'https://appstoreconnect.apple.com');
  document.body.textContent = 'sent ' + files.length;
})();
</script>
